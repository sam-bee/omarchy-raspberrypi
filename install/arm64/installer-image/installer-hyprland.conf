# Standalone installer desktop: no Omarchy shell, portals, or full desktop
# startup.  The launch helper creates the output before starting Foot.
monitor = ,preferred,auto,1

input {
  kb_layout = us
  follow_mouse = 1
}

general {
  border_size = 1
  gaps_in = 0
  gaps_out = 0
  layout = dwindle
}

decoration {
  rounding = 0
  blur {
    enabled = false
  }
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

exec-once = /usr/local/libexec/omarchy-pi/start-installer-desktop.sh
